services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: praxisnote-db-e2e
    environment:
      POSTGRES_USER: praxisnote
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: praxisnote_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxisnote"]
      interval: 5s
      timeout: 5s
      retries: 5
