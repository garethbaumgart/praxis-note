services:
  postgres:
    image: postgres:17-alpine
    container_name: praxisnote-db
    environment:
      POSTGRES_USER: praxisnote
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: praxisnote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxisnote"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
