services:
  postgres:
    image: postgres:17-alpine
    container_name: praxisnote-db-dev
    environment:
      POSTGRES_USER: praxisnote
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: praxisnote
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxisnote"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile.api
    container_name: praxisnote-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=praxisnote;Username=praxisnote;Password=devpassword"
      Authentication__Google__ClientId: "mock-client-id"
      Authentication__Google__ClientSecret: "mock-client-secret"
    ports:
      - "5002:5002"
    volumes:
      - ./src:/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile.frontend
    container_name: praxisnote-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - ./src/PraxisNote.Web/ClientApp:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_dev_data:
