<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kanban Theme Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
  <style id="done-theme"></style>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-semibold text-gray-800">Tasks</h1>
      <button class="flex items-center gap-2 h-9 px-3 text-sm font-medium text-gray-900 bg-violet-100 hover:bg-violet-200 rounded-lg transition-colors">
        <i class="pi pi-plus text-violet-600"></i>
        <span>Add Task</span>
      </button>
    </div>

    <!-- Kanban Board -->
    <div class="grid grid-cols-3 gap-6">
      <!-- Todo Column -->
      <div class="rounded-lg p-3 min-h-48 bg-slate-100">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-2 h-2 rounded-full bg-slate-500"></div>
          <span class="text-xs font-medium text-slate-600 uppercase tracking-wide">Todo</span>
          <span class="text-xs text-slate-400">2</span>
        </div>
        <div class="space-y-2">
          <div class="bg-white rounded-lg border border-gray-200 p-3 shadow-sm">
            <div class="mb-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600">Todo</span>
            </div>
            <div class="flex items-start gap-2">
              <i class="pi pi-file text-gray-400 text-sm mt-0.5"></i>
              <p class="text-sm text-gray-800">Review pull request</p>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-gray-200 p-3 shadow-sm">
            <div class="mb-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-600">Todo</span>
            </div>
            <div class="flex items-start gap-2">
              <i class="pi pi-file text-gray-400 text-sm mt-0.5"></i>
              <p class="text-sm text-gray-800">Update documentation</p>
            </div>
          </div>
        </div>
      </div>

      <!-- In Progress Column -->
      <div class="rounded-lg p-3 min-h-48 bg-sky-100">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-2 h-2 rounded-full bg-sky-600"></div>
          <span class="text-xs font-medium text-sky-700 uppercase tracking-wide">In Progress</span>
          <span class="text-xs text-sky-500">1</span>
        </div>
        <div class="space-y-2">
          <div class="bg-white rounded-lg border border-gray-200 p-3 shadow-sm">
            <div class="mb-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-600">In Progress</span>
            </div>
            <div class="flex items-start gap-2">
              <i class="pi pi-file text-gray-400 text-sm mt-0.5"></i>
              <p class="text-sm text-gray-800">Implement drag-drop reordering</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Done Column -->
      <div id="done-column" class="rounded-lg p-3 min-h-48">
        <div class="flex items-center gap-2 mb-3">
          <div id="done-dot" class="w-2 h-2 rounded-full"></div>
          <span id="done-label" class="text-xs font-medium uppercase tracking-wide">Done</span>
          <span id="done-count" class="text-xs">3</span>
        </div>
        <div class="space-y-2">
          <div class="bg-white rounded-lg border border-gray-200 p-3 shadow-sm">
            <div class="mb-2">
              <span id="done-badge-1" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium">Done</span>
            </div>
            <div class="flex items-start gap-2">
              <i class="pi pi-file text-gray-400 text-sm mt-0.5"></i>
              <p class="text-sm text-gray-800">Set up project structure</p>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-gray-200 p-3 shadow-sm">
            <div class="mb-2">
              <span id="done-badge-2" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium">Done</span>
            </div>
            <div class="flex items-start gap-2">
              <i class="pi pi-file text-gray-400 text-sm mt-0.5"></i>
              <p class="text-sm text-gray-800">Add authentication</p>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-gray-200 p-3 shadow-sm">
            <div class="mb-2">
              <span id="done-badge-3" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium">Done</span>
            </div>
            <div class="flex items-start gap-2">
              <i class="pi pi-file text-gray-400 text-sm mt-0.5"></i>
              <p class="text-sm text-gray-800">Create task model</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme data accessible from Playwright
    window.themes = {
      teal:    { bg: '#ccfbf1', dot: '#0d9488', label: '#0f766e', count: '#14b8a6', badge: { bg: '#f0fdfa', text: '#0f766e' } },
      violet:  { bg: '#ede9fe', dot: '#7c3aed', label: '#6d28d9', count: '#8b5cf6', badge: { bg: '#f5f3ff', text: '#6d28d9' } },
      purple:  { bg: '#f3e8ff', dot: '#9333ea', label: '#7e22ce', count: '#a855f7', badge: { bg: '#faf5ff', text: '#7e22ce' } },
      slate:   { bg: '#f1f5f9', dot: '#64748b', label: '#475569', count: '#94a3b8', badge: { bg: '#f8fafc', text: '#475569' } },
      gray:    { bg: '#f3f4f6', dot: '#6b7280', label: '#4b5563', count: '#9ca3af', badge: { bg: '#f9fafb', text: '#4b5563' } },
      emerald: { bg: '#d1fae5', dot: '#059669', label: '#047857', count: '#10b981', badge: { bg: '#ecfdf5', text: '#047857' } },
      cyan:    { bg: '#cffafe', dot: '#0891b2', label: '#0e7490', count: '#06b6d4', badge: { bg: '#ecfeff', text: '#0e7490' } },
      amber:   { bg: '#fef3c7', dot: '#d97706', label: '#b45309', count: '#f59e0b', badge: { bg: '#fffbeb', text: '#b45309' } },
      rose:    { bg: '#ffe4e6', dot: '#e11d48', label: '#be123c', count: '#f43f5e', badge: { bg: '#fff1f2', text: '#be123c' } },
      indigo:  { bg: '#e0e7ff', dot: '#4f46e5', label: '#4338ca', count: '#6366f1', badge: { bg: '#eef2ff', text: '#4338ca' } },
    };

    window.applyTheme = function(themeName) {
      const theme = window.themes[themeName];
      if (!theme) return;

      document.getElementById('done-column').style.backgroundColor = theme.bg;
      document.getElementById('done-dot').style.backgroundColor = theme.dot;
      document.getElementById('done-label').style.color = theme.label;
      document.getElementById('done-count').style.color = theme.count;

      ['done-badge-1', 'done-badge-2', 'done-badge-3'].forEach(id => {
        const el = document.getElementById(id);
        el.style.backgroundColor = theme.badge.bg;
        el.style.color = theme.badge.text;
      });
    };

    // Apply default theme
    window.applyTheme('teal');
  </script>
</body>
</html>
