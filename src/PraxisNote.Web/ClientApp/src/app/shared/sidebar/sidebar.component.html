<!-- Desktop Sidebar -->
<aside class="hidden lg:flex lg:flex-col w-56 border-r border-border bg-surface-subtle/80">
  <!-- Workspace header -->
  <div class="h-14 flex items-center gap-3 px-4 border-b border-border">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center shadow-sm">
      <i class="pi pi-check-square text-white text-sm"></i>
    </div>
    <div class="flex-1 min-w-0">
      <span class="font-semibold text-foreground text-sm">PraxisNote</span>
    </div>
  </div>

  <!-- Search -->
  <div class="px-3 py-3">
    <button class="w-full h-9 flex items-center gap-2 px-3 text-sm text-foreground-secondary bg-surface-muted hover:bg-surface-muted/80 rounded-lg transition-colors duration-150" aria-label="Search">
      <i class="pi pi-search text-xs"></i>
      <span>Search</span>
    </button>
  </div>

  <!-- Main navigation -->
  <nav class="flex-1 px-3 py-1 space-y-0.5 overflow-y-auto" role="navigation" aria-label="Main navigation">
    @for (item of navItems; track item.path) {
      <button
        type="button"
        class="w-full group flex items-center gap-3 h-9 px-3 text-sm rounded-lg text-left"
        [class.font-medium]="isActive(item.path)"
        [class.text-foreground]="isActive(item.path)"
        [class.bg-accent]="isActive(item.path)"
        [class.text-foreground-secondary]="!isActive(item.path)"
        [class.hover:bg-surface-muted]="!isActive(item.path)"
        [class.opacity-50]="!item.enabled"
        [class.cursor-not-allowed]="!item.enabled"
        [disabled]="!item.enabled"
        (click)="item.enabled && navigate(item.path)"
      >
        <i
          class="pi {{ item.icon }}"
          [class.text-accent-foreground]="isActive(item.path)"
          [class.text-foreground-muted]="!isActive(item.path)"
        ></i>
        <span>{{ item.label }}</span>
      </button>
    }

    <!-- Divider -->
    <div class="py-3">
      <div class="h-px bg-border"></div>
    </div>

    <!-- Recent section -->
    <div class="px-3 h-8 flex items-center">
      <span class="text-xs font-medium text-foreground-muted uppercase tracking-wider">Recent</span>
    </div>
    <div class="px-3 py-2">
      <p class="text-xs text-foreground-muted">No recent notes yet</p>
    </div>
  </nav>

  <!-- Theme toggle and User section -->
  <div class="p-3 border-t border-border space-y-2">
    <!-- Theme toggle -->
    <button
      class="w-full flex items-center gap-3 h-10 px-2 hover:bg-surface-muted rounded-lg transition-colors duration-150"
      (click)="toggleTheme()"
      aria-label="Toggle theme"
    >
      @if (themeService.theme() === 'light') {
        <i class="pi pi-moon text-foreground-muted"></i>
        <span class="text-sm text-foreground-secondary">Dark mode</span>
      } @else {
        <i class="pi pi-sun text-foreground-muted"></i>
        <span class="text-sm text-foreground-secondary">Light mode</span>
      }
    </button>

    <!-- User -->
    <button
      class="w-full flex items-center gap-3 h-10 px-2 hover:bg-surface-muted rounded-lg transition-colors duration-150"
      (click)="logout()"
      aria-label="Sign out"
    >
      @if (user().avatarUrl) {
        <img [src]="user().avatarUrl!" class="w-7 h-7 rounded-full ring-2 ring-surface shadow-sm" [alt]="user().name" />
      } @else {
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center ring-2 ring-surface shadow-sm">
          <span class="text-white text-xs font-medium">{{ user().name.charAt(0) }}</span>
        </div>
      }
      <div class="flex-1 min-w-0 text-left">
        <p class="text-sm font-medium text-foreground truncate">{{ user().name }}</p>
      </div>
      <i class="pi pi-sign-out text-foreground-muted text-sm" aria-hidden="true"></i>
    </button>
  </div>
</aside>

<!-- Mobile drawer overlay -->
@if (mobileOpen()) {
  <div class="fixed inset-0 z-40 lg:hidden">
    <div class="absolute inset-0 bg-gray-900/60" (click)="closeMobile.emit()" aria-hidden="true"></div>
    <aside class="absolute inset-y-0 left-0 w-72 bg-surface shadow-2xl flex flex-col animate-slide-in" role="dialog" aria-label="Navigation menu">
      <!-- Mobile sidebar header -->
      <div class="h-14 flex items-center justify-between px-4 border-b border-border">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center shadow-sm">
            <i class="pi pi-check-square text-white text-sm" aria-hidden="true"></i>
          </div>
          <span class="font-semibold text-foreground">PraxisNote</span>
        </div>
        <button class="w-8 h-8 flex items-center justify-center hover:bg-surface-muted rounded-lg" (click)="closeMobile.emit()" aria-label="Close navigation menu">
          <i class="pi pi-times text-foreground-secondary" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Mobile nav -->
      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto" role="navigation" aria-label="Mobile navigation">
        @for (item of navItems; track item.path) {
          <button
            type="button"
            class="w-full flex items-center gap-3 h-11 px-3 text-sm rounded-lg text-left"
            [class.font-medium]="isActive(item.path)"
            [class.text-foreground]="isActive(item.path)"
            [class.bg-accent]="isActive(item.path)"
            [class.text-foreground-secondary]="!isActive(item.path)"
            [class.hover:bg-surface-muted]="!isActive(item.path)"
            [class.opacity-50]="!item.enabled"
            [class.cursor-not-allowed]="!item.enabled"
            [disabled]="!item.enabled"
            (click)="item.enabled && navigate(item.path)"
          >
            <i
              class="pi {{ item.icon }}"
              [class.text-accent-foreground]="isActive(item.path)"
              [class.text-foreground-muted]="!isActive(item.path)"
              aria-hidden="true"
            ></i>
            <span>{{ item.label }}</span>
          </button>
        }
      </nav>

      <!-- Mobile theme toggle and user section -->
      <div class="p-3 border-t border-border space-y-2">
        <!-- Theme toggle -->
        <button
          class="w-full flex items-center gap-3 h-12 px-3 hover:bg-surface-muted rounded-lg"
          (click)="toggleTheme()"
          aria-label="Toggle theme"
        >
          @if (themeService.theme() === 'light') {
            <i class="pi pi-moon text-foreground-muted"></i>
            <span class="text-sm text-foreground-secondary">Dark mode</span>
          } @else {
            <i class="pi pi-sun text-foreground-muted"></i>
            <span class="text-sm text-foreground-secondary">Light mode</span>
          }
        </button>

        <!-- User -->
        <button class="w-full flex items-center gap-3 h-12 px-3 hover:bg-surface-muted rounded-lg" (click)="logout()" aria-label="Sign out">
          @if (user().avatarUrl) {
            <img [src]="user().avatarUrl!" class="w-8 h-8 rounded-full" [alt]="user().name" />
          } @else {
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center">
              <span class="text-white text-sm font-medium">{{ user().name.charAt(0) }}</span>
            </div>
          }
          <div class="flex-1 text-left">
            <p class="text-sm font-medium text-foreground">{{ user().name }}</p>
            <p class="text-xs text-foreground-secondary">Sign out</p>
          </div>
        </button>
      </div>
    </aside>
  </div>
}
