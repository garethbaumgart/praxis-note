<main class="min-h-screen bg-surface-ground flex items-center justify-center p-4">
  <p-card class="w-full max-w-md">
    <ng-template #header>
      <div class="flex items-center justify-between p-4">
        <h1 class="text-2xl font-bold text-surface-900">{{ title }}</h1>
        <p-tag [value]="apiStatus()" [severity]="apiSeverity()" />
      </div>
    </ng-template>
    <p class="text-surface-600">App is running.</p>
  </p-card>
</main>
