@if (auth.loading()) {
  <!-- Loading state -->
  <div class="min-h-screen flex items-center justify-center bg-surface-subtle">
    <div class="flex flex-col items-center gap-4">
      <i class="pi pi-spin pi-spinner text-4xl text-accent-foreground"></i>
      <p class="text-foreground-muted">Loading...</p>
    </div>
  </div>
} @else if (auth.isAuthenticated()) {
  <!-- Authenticated: Modern app layout -->
  <div class="h-screen flex overflow-hidden bg-surface">
    <!-- Sidebar (handles both desktop and mobile) -->
    <app-sidebar
      [user]="auth.user()!"
      [mobileOpen]="sidebarOpen()"
      (closeMobile)="closeSidebar()"
      (onLogout)="logout()"
    />

    <!-- Main content area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <!-- Top bar -->
      <header class="h-14 flex items-center justify-between px-4 lg:px-6 border-b border-border bg-surface/80 backdrop-blur-sm">
        <div class="flex items-center gap-3">
          <button class="lg:hidden w-9 h-9 flex items-center justify-center hover:bg-surface-muted rounded-lg" (click)="toggleSidebar()" aria-label="Open navigation menu">
            <i class="pi pi-bars text-foreground-secondary" aria-hidden="true"></i>
          </button>
          <nav class="flex items-center gap-1 text-sm" aria-label="Breadcrumb">
            <span class="text-foreground-muted">Home</span>
          </nav>
        </div>
        <div class="flex items-center gap-2">
          <button class="w-9 h-9 flex items-center justify-center hover:bg-surface-muted rounded-lg" aria-label="Notifications">
            <i class="pi pi-bell text-foreground-muted" aria-hidden="true"></i>
          </button>
          <button class="w-9 h-9 flex items-center justify-center hover:bg-surface-muted rounded-lg" aria-label="Settings">
            <i class="pi pi-cog text-foreground-muted" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 overflow-y-auto bg-surface-subtle/50">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <!-- Unauthenticated: Login screen -->
  <app-login (onLogin)="login()" />
}
