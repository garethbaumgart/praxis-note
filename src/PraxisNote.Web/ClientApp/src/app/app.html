@if (auth.loading()) {
  <!-- Loading state -->
  <div class="min-h-screen flex items-center justify-center bg-surface-subtle">
    <div class="flex flex-col items-center gap-4">
      <i class="pi pi-spin pi-spinner text-4xl text-accent-foreground"></i>
      <p class="text-foreground-muted">Loading...</p>
    </div>
  </div>
} @else if (auth.isAuthenticated()) {
  <!-- Authenticated: Modern app layout -->
  <div class="h-screen flex overflow-hidden bg-surface">
    <!-- Sidebar (handles both desktop and mobile) -->
    <app-sidebar
      [user]="auth.user()!"
      [mobileOpen]="sidebarOpen()"
      (closeMobile)="closeSidebar()"
      (onLogout)="logout()"
    />

    <!-- Main content area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <!-- Top bar -->
      <header class="h-14 flex items-center justify-between px-4 lg:px-6 border-b border-border bg-surface/80 backdrop-blur-sm">
        <div class="flex items-center gap-3">
          <button class="lg:hidden w-9 h-9 flex items-center justify-center hover:bg-surface-muted rounded-lg" (click)="toggleSidebar()" aria-label="Open navigation menu">
            <i class="pi pi-bars text-foreground-secondary" aria-hidden="true"></i>
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button
            class="w-9 h-9 flex items-center justify-center hover:bg-surface-muted rounded-lg relative"
            [attr.aria-label]="notificationService.unseenCount() === 0 ? 'Notifications' : 'Notifications (' + (notificationService.unseenCount() > 99 ? '99+' : notificationService.unseenCount()) + ' unread)'"
            (click)="toggleNotificationPanel()"
          >
            <i
              class="pi pi-bell"
              [class.text-foreground-muted]="notificationService.unseenCount() === 0"
              [class.text-accent-foreground]="notificationService.unseenCount() > 0"
              aria-hidden="true"
            ></i>
            @if (notificationService.unseenCount() > 0) {
              <span class="absolute -top-1 -right-1 min-w-5 h-5 flex items-center justify-center px-1.5 text-xs font-medium rounded-full bg-danger text-white">
                {{ notificationService.unseenCount() > 99 ? '99+' : notificationService.unseenCount() }}
              </span>
            }
          </button>
          <button class="w-9 h-9 flex items-center justify-center hover:bg-surface-muted rounded-lg" aria-label="Settings">
            <i class="pi pi-cog text-foreground-muted" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 overflow-y-auto bg-surface-subtle/50">
        <router-outlet />
      </main>
    </div>

    <!-- Notification Panel -->
    <app-notification-panel
      [visible]="notificationPanelOpen()"
      (visibleChange)="notificationPanelOpen.set($event)"
    />
  </div>
} @else {
  <!-- Unauthenticated: Login screen -->
  <app-login (onLogin)="login()" />
}

<!-- Dev toolbar for mock authentication (only visible in dev mode) -->
<app-mock-auth-toolbar />

<!-- Global toast notifications -->
<p-toast position="bottom-right" />
