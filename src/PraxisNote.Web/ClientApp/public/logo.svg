<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e81ac"/>
      <stop offset="100%" style="stop-color:#81a1c1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>
  <!-- Main rounded square with checkmark -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="white"/>
  <polyline points="22,32 30,40 44,24" fill="none" stroke="#5e81ac" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neural accent dots outside -->
  <circle cx="8" cy="8" r="3" fill="white" opacity="0.6"/>
  <circle cx="56" cy="8" r="3" fill="white" opacity="0.6"/>
  <circle cx="8" cy="56" r="3" fill="white" opacity="0.6"/>
  <circle cx="56" cy="56" r="3" fill="white" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="11" y1="11" x2="16" y2="16" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="53" y1="11" x2="48" y2="16" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="11" y1="53" x2="16" y2="48" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="53" y1="53" x2="48" y2="48" stroke="white" stroke-width="1" opacity="0.4"/>
</svg>
